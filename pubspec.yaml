name: authen_app_uts
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  video_player: ^2.11.0
  video_thumbnail: ^0.5.6
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "lib/assets/images/logo.jpg"

flutter:
  uses-material-design: true
  assets:
    - lib/assets/videos/video1.mp4
    - lib/assets/videos/video2.mp4
    - lib/assets/videos/video3.mp4
    - lib/assets/videos/video4.mp4
    - lib/assets/videos/video5.mp4
    - lib/assets/images/logo.jpg